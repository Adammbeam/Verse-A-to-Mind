<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root { --bg: #0f1419; --fg: #e6edf3; --accent: #58a6ff; --card: #161b22; --border: #30363d; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; padding: 1rem; }
h1 { font-size: 1.5rem; margin: 0 0 1rem; }
form, .controls { display: grid; gap: 0.75rem; margin-bottom: 1rem; }
label { display: flex; flex-direction: column; font-size: 0.9rem; }
input, select, button, textarea { font: inherit; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--fg); }
button { background: var(--accent); color: #0f1419; border: none; cursor: pointer; font-weight: 600; }
button:hover { opacity: 0.9; }
.list { display: flex; flex-direction: column; gap: 0.5rem; }
.category { font-weight: 700; margin-top: 1rem; color: var(--accent); }
.item { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem; background: var(--card); border-radius: 6px; }
.item input[type=checkbox] { width: 1.2rem; height: 1.2rem; }
.item label { flex: 1; margin: 0; }
.qty { color: #8b949e; font-size: 0.85rem; }
.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
#status { font-size: 0.85rem; color: #8b949e; }
@media (min-width: 600px) { form { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); } }
</style>

<body>
<h1>Packing List Maker</h1>
<p>Enter your trip details. Get a tailored list. Tick items off. Everything stays on this device.</p>

<form id="trip">
  <label>Days <input type="number" id="days" min="1" max="60" value="5"></label>
  <label>Weather
    <select id="weather">
      <option value="mixed">Mixed</option>
      <option value="hot">Hot</option>
      <option value="cold">Cold</option>
      <option value="rainy">Rainy</option>
    </select>
  </label>
  <label>Trip type
    <select id="type">
      <option value="city">City</option>
      <option value="beach">Beach</option>
      <option value="hiking">Hiking</option>
      <option value="business">Business</option>
      <option value="camping">Camping</option>
    </select>
  </label>
  <label>Notes <input type="text" id="notes" placeholder="e.g. formal dinner"></label>
</form>

<div class="actions">
  <button type="button" id="generate">Generate list</button>
  <button type="button" id="copy">Copy list</button>
  <button type="button" id="download">Download .txt</button>
  <button type="button" id="clear">Clear checks</button>
</div>
<div id="status"></div>

<div id="list" class="list"></div>

<div style="margin-top:1.5rem">
  <label>Add custom item <input type="text" id="custom" placeholder="e.g. prescription meds"> <button type="button" id="addCustom">Add</button></label>
</div>

<script src="app.js"></script>
<footer class="vl-bar"><a href="/lab/">&larr; Lab</a> <a href="/">Ask Verse anything</a></footer>
</body>
</html>
