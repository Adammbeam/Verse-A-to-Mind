body { margin:0; background:#0a0a12; color:#e0e0ff; font-family:system-ui,sans-serif; overflow:hidden; }
#stage { position:fixed; inset:0; }
.card {
  position:absolute; width:70px; height:50px; border-radius:8px; background:rgba(40,60,140,0.85);
  border:2px solid #6af; display:flex; align-items:center; justify-content:center; font-size:11px;
  cursor:pointer; user-select:none; transition:transform 0.05s; box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.card.rewarded { border-color:#f80; box-shadow:0 0 16px #f80; }
#hud {
  position:fixed; top:12px; left:12px; background:rgba(10,12,30,0.9); padding:12px; border-radius:10px;
  border:1px solid #445; max-width:280px; z-index:100; font-size:13px;
}
button { background:#224; color:#cef; border:1px solid #68a; padding:6px 10px; margin:4px 4px 0 0; border-radius:6px; cursor:pointer; }
button:hover { background:#336; }
#status { font-size:12px; color:#8af; margin-top:6px; }
