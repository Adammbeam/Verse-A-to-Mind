<!doctype html>
<html lang="en" class="vs-tool"><link rel="stylesheet" href="/verse.css" media="screen">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL encode and decode · Verse</title>
<meta name="description" content="Encode text for a URL or decode percent-encoded text back, live as you type. Runs on your device, nothing sent anywhere.">
<link rel="canonical" href="https://a-to-mind.com/base64/url/">
<style>
  :root { color-scheme: dark; --bg: #0b0a10; --ink: #ecebf5; --soft: #a3a0b3; --line: #2c2938; --accent: #a58bff; --bad: #ff8a80; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 18px; margin: 0 0 10px; text-align: center; font-weight: 600; color: var(--soft); }
  label.head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; color: var(--soft); margin: 12px 0 4px; }
  textarea { box-sizing: border-box; width: 100%; min-height: 160px; font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
  select, button { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; min-height: 40px; background: transparent; color: var(--ink); cursor: pointer; }
  select { border-radius: 10px; padding: 6px 10px; }
  select option { background: var(--bg); color: var(--ink); }
  .note { font-size: 13px; color: var(--soft); min-height: 1.5em; margin: 4px 0; }
  .note.bad { color: var(--bad); }
  footer { font-size: 12px; color: var(--soft); margin-top: 22px; text-align: center; } footer a { color: inherit; }
</style>
<script src="/visit.js" defer></script>
<script type="module" src="/lib/verse-scene.js"></script>
</head>
<body>
<nav class="v-modes" aria-label="Encode modes" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px auto 4px;max-width:720px;font:600 13px/1 system-ui,sans-serif"><style>.v-modes a{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid #3a3550;color:inherit;text-decoration:none;opacity:.8}.v-modes a[aria-current]{opacity:1;background:#2a2340;border-color:#6b5bb0}</style><a href="/base64/">Base64</a><a href="/base64/?mode=bases">Number bases</a><a href="/base64/?mode=url" aria-current="page">URL encode</a></nav>
<main>
  <h1>URL encode and decode</h1>
  <div class="row" role="group" aria-label="Options">
    <label>Mode <select id="mode"><option value="component">Component (encodeURIComponent)</option><option value="uri">Whole URL (encodeURI)</option></select></label>
  </div>
  <label class="head" for="plain">Text <span id="plainCount"></span></label>
  <textarea id="plain" spellcheck="false" placeholder="Type or paste text to URL-encode"></textarea>
  <label class="head" for="encoded">Encoded <span id="encCount"></span></label>
  <textarea id="encoded" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Or paste percent-encoded text to decode"></textarea>
  <p class="note" id="note" role="status" aria-live="polite"></p>
  <div class="row">
    <button type="button" id="copyEnc">Copy encoded</button>
    <button type="button" id="copyPlain">Copy text</button>
    <button type="button" id="clear">Clear</button>
  </div>
  <footer>URL encoding runs on this device as you type. Nothing is sent anywhere. <a href="/base64/">Base64</a> · <a href="/">Ask Verse anything</a></footer>
</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  const plain = $('plain'), encoded = $('encoded'), note = $('note'), mode = $('mode');
  let last = '';
  const enc = (s) => mode.value === 'uri' ? encodeURI(s) : encodeURIComponent(s);
  const dec = (s) => { try { return { ok: true, v: decodeURIComponent(s.replace(/\+/g, '%20')) }; } catch (e) { return { ok: false, v: '' }; } };
  const count = (el, out) => { out.textContent = el.value ? el.value.length.toLocaleString() + ' chars' : ''; };
  function fromPlain() {
    last = 'plain';
    encoded.value = plain.value ? enc(plain.value) : '';
    note.textContent = ''; note.className = 'note';
    count(plain, $('plainCount')); count(encoded, $('encCount'));
  }
  function fromEncoded() {
    last = 'encoded';
    if (!encoded.value) { plain.value = ''; note.textContent = ''; note.className = 'note'; count(plain,$('plainCount')); count(encoded,$('encCount')); return; }
    const r = dec(encoded.value);
    if (!r.ok) { note.textContent = 'That is not valid percent-encoding.'; note.className = 'note bad'; count(plain,$('plainCount')); count(encoded,$('encCount')); return; }
    plain.value = r.v; note.textContent = ''; note.className = 'note';
    count(plain, $('plainCount')); count(encoded, $('encCount'));
  }
  plain.addEventListener('input', fromPlain);
  encoded.addEventListener('input', fromEncoded);
  mode.addEventListener('change', () => { if (last === 'encoded') fromEncoded(); else fromPlain(); });
  $('copyEnc').addEventListener('click', async () => { try { await navigator.clipboard.writeText(encoded.value); note.textContent = 'Copied encoded text.'; note.className='note'; } catch (_) {} });
  $('copyPlain').addEventListener('click', async () => { try { await navigator.clipboard.writeText(plain.value); note.textContent = 'Copied text.'; note.className='note'; } catch (_) {} });
  $('clear').addEventListener('click', () => { plain.value=''; encoded.value=''; note.textContent=''; note.className='note'; count(plain,$('plainCount')); count(encoded,$('encCount')); plain.focus(); });
  const q = new URLSearchParams(location.search);
  if (q.get('t')) { plain.value = q.get('t'); fromPlain(); }
  else if (q.get('u')) { encoded.value = q.get('u'); fromEncoded(); }
</script>
</body>
</html>
