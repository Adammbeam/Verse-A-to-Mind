<!doctype html>
<html lang="en" class="vs-tool"><link rel="stylesheet" href="/verse.css" media="screen">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAT calculator · Verse</title>
<meta name="description" content="Add VAT to a net sum or take it out of a total. Worked out on this device, to the cent, so net plus VAT is the total.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verse">
<meta property="og:title" content="VAT calculator · Verse">
<meta property="og:description" content="Add VAT or take it out. Nothing you type is sent.">
<meta property="og:url" content="https://a-to-mind.com/calculator/?mode=vat">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; --bg: #0b0a10; --ink: #ecebf5; --soft: #a3a0b3; --line: #2c2938; --accent: #a58bff; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  label { display: block; font-size: 13px; color: var(--soft); margin: 12px 0 6px; }
  input, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 42px; width: 100%; box-sizing: border-box; }
  .rates { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .rates button, .go { font: inherit; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; padding: 0 14px; cursor: pointer; }
  .rates button[aria-pressed="true"], .go { background: var(--accent); border-color: var(--accent); color: #15131c; font-weight: 700; }
  .out { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  .out b { font-size: 28px; display: block; }
  .note { color: var(--soft); font-size: 13px; }
  a { color: inherit; }
</style>
<link rel="canonical" href="https://a-to-mind.com/calculator/?mode=vat">
</head>
<body>
<main>
  <h1>VAT calculator</h1>
  <p class="note">Add VAT to a net sum, or take it out of a total. Net plus VAT is the total, to the cent. Nothing is sent.</p>
  <label for="amount">Sum</label>
  <input id="amount" inputmode="decimal" value="1000" autocomplete="off">
  <label for="how">What to do</label>
  <select id="how">
    <option value="extract">Take VAT out of this total</option>
    <option value="add">Add VAT on top of this net</option>
  </select>
  <label for="rate">Rate (%)</label>
  <input id="rate" inputmode="decimal" value="22" autocomplete="off">
  <div class="rates" id="rates" role="group" aria-label="Common VAT rates"></div>
  <button class="go" id="go" type="button">Work it out</button>
  <div class="out" aria-live="polite">
    <span class="note" id="lead">Total</span>
    <b id="big">—</b>
    <p id="lines" class="note"></p>
  </div>
  <p class="note"><a href="/vat/">Russian, English and German labels, and the history list</a> · <a href="/calculator/">Scientific calculator</a> · <a href="/calculator/modes/formulas">Formula calculators</a></p>
</main>
<script type="module">
import { compute, money, workingOf, RATES } from '/lib/vat.js';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const how = (q.get('vat') === 'add' || q.get('mode') === 'add') ? 'add' : 'extract';
$('how').value = how;
if (q.get('sum') || q.get('amount')) $('amount').value = q.get('sum') || q.get('amount');
if (q.get('rate')) $('rate').value = q.get('rate');
const rates = $('rates');
for (const n of RATES) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = String(n);
  b.setAttribute('aria-pressed', String(Number($('rate').value) === n));
  b.addEventListener('click', () => { $('rate').value = String(n); run(); });
  rates.append(b);
}
function run() {
  const mode = $('how').value === 'add' ? 'add' : 'extract';
  const r = compute({ amount: $('amount').value, rate: $('rate').value, mode });
  for (const b of rates.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.textContent === String($('rate').value).trim()));
  if (!r) { $('lead').textContent = 'That sum or rate is not a number'; $('big').textContent = '—'; $('lines').textContent = ''; return; }
  $('lead').textContent = mode === 'add' ? 'Total with VAT' : 'Net, VAT taken out';
  $('big').textContent = money(mode === 'add' ? r.gross : r.net, 'en');
  $('lines').textContent = workingOf(r, 'en').join(' · ') + ' · VAT ' + money(r.vat, 'en') + ' · total ' + money(r.gross, 'en');
  const next = new URL(location.href);
  next.searchParams.set('mode', 'vat');
  next.searchParams.set('vat', mode);
  next.searchParams.set('sum', String(r.amount));
  next.searchParams.set('rate', String(r.rate));
  history.replaceState(null, '', next.pathname + next.search);
}
$('go').addEventListener('click', run);
for (const id of ['amount', 'rate', 'how']) $(id).addEventListener('input', run);
run();
</script>
</body>
</html>
