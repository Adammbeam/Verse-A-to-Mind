<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposals · Verse</title>
<meta name="description" content="Patches waiting for a runner: the Worker stores and decides, the runner proves. Nothing here applies a patch.">
<link rel="canonical" href="https://a-to-mind.com/proposals/">
<meta property="og:title" content="Proposals · Verse">
<meta property="og:image" content="https://a-to-mind.com/og.png">
<meta name="robots" content="noindex">
<style>
  :root { --ink: #e9e9ea; --dim: #8b8b90; --line: #232326; --bg: #08080a; --ok: #7ee0a3; --bad: #ff8a8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 22px 20px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .sub { color: var(--dim); font-size: 13px; }
  main { padding: 16px 20px 60px; max-width: 1100px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=password] { flex: 1 1 260px; min-width: 220px; background: #101013; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit; }
  button { background: #16161a; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a3a40; }
  button[disabled] { opacity: .45; cursor: default; }
  button.ship { border-color: #245; }
  button.refuse { border-color: #422; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .card h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .meta { color: var(--dim); font-size: 13px; }
  .state { text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
  .state.open { color: var(--ok); } .state.refused { color: var(--bad); } .state.shipped { color: #9fc4ff; }
  pre { background: #0d0d10; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 46vh; font-size: 12.5px; margin: 10px 0; }
  .add { color: var(--ok); } .del { color: var(--bad); }
  .note { color: var(--dim); font-size: 13px; margin-top: 10px; }
  .err { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Proposals</h1>
  <div class="sub">Patches waiting for a runner. The Worker stores and decides; the runner proves. Nothing here applies a patch.</div>
</header>
<main>
  <div class="row">
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="owner token (kept in this tab only)">
    <button id="load">Load</button>
    <button id="forget">Forget</button>
  </div>
  <div class="note" id="note">The token is held in this tab's session storage and sent as a bearer header. It is never written to the page.</div>
  <div id="list"></div>
</main>
<script>
// A read-only view of the proposal queue, plus the three decisions the API allows. No build step, no framework, no innerHTML with
// anything that came from a proposal: a diff is arbitrary text, so it goes in as textContent.
const KEY = 'a2m.proposals.token';
const el = (id) => document.getElementById(id);
const list = el('list');
const token = () => sessionStorage.getItem(KEY) || '';
const say = (m, bad) => { const n = el('note'); n.textContent = m; n.className = bad ? 'err' : 'note'; };

async function call(path, init = {}) {
  const r = await fetch('/api/proposals' + path, { ...init, headers: { authorization: 'Bearer ' + token(), 'content-type': 'application/json', ...(init.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
  return body;
}

function card(p) {
  const box = document.createElement('div');
  box.className = 'card';
  const h = document.createElement('h2');
  h.textContent = p.title;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = '#' + p.id + ' · ' + (p.author || 'unknown') + ' → ' + p.branch + ' · ' + p.files + ' files, +' + p.added + ' −' + p.removed + ' · ';
  const st = document.createElement('span');
  st.className = 'state ' + p.state;
  st.textContent = p.state;
  meta.appendChild(st);
  const tests = document.createElement('div');
  tests.className = 'meta';
  tests.textContent = p.tests ? 'ran: ' + p.tests : 'nobody said what they ran';
  const pre = document.createElement('pre');
  pre.textContent = 'loading diff…';
  const row = document.createElement('div');
  row.className = 'row';
  const show = document.createElement('button'); show.textContent = 'Show diff';
  show.onclick = async () => {
    show.disabled = true;
    try {
      const { proposal } = await call('?id=' + encodeURIComponent(p.id));
      pre.textContent = '';
      for (const line of String(proposal.diff || '').split('\n')) {
        const span = document.createElement('span');
        span.className = line.startsWith('+') && !line.startsWith('+++') ? 'add' : line.startsWith('-') && !line.startsWith('---') ? 'del' : '';
        span.textContent = line + '\n';
        pre.appendChild(span);
      }
    } catch (e) { pre.textContent = String(e.message || e); }
    show.disabled = false;
  };
  const decide = (action, label, cls) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.onclick = async () => {
      b.disabled = true;
      try { await call('', { method: 'PATCH', body: JSON.stringify({ id: p.id, action }) }); await load(); }
      catch (e) { say(String(e.message || e), true); b.disabled = false; }
    };
    return b;
  };
  row.append(show);
  if (p.state === 'open' || p.state === 'checking') { row.append(decide('ship', 'Ship', 'ship'), decide('refuse', 'Refuse', 'refuse')); }
  if (p.state === 'shipped') row.append(decide('revert', 'Revert', 'refuse'));
  box.append(h, meta, tests, pre, row);
  if (p.verdict) { const v = document.createElement('div'); v.className = 'note'; v.textContent = 'verdict: ' + p.verdict; box.append(v); }
  return box;
}

async function load() {
  if (!token()) { say('Paste the owner token first. It is what the API checks.', true); return; }
  say('Loading…');
  try {
    const { proposals } = await call('?state=open');
    const all = proposals || [];
    list.textContent = '';
    if (!all.length) say('Nothing waiting. A patch arrives at POST /api/proposals, and the runner proves it.');
    else { for (const p of all) list.append(card(p)); say(all.length + ' waiting · Ship and Refuse move the record; the runner does the work.'); }
  } catch (e) { say(String(e.message || e), true); }
}

el('token').value = token();
el('load').onclick = () => { const v = el('token').value.trim(); if (v) sessionStorage.setItem(KEY, v); load(); };
el('forget').onclick = () => { sessionStorage.removeItem(KEY); el('token').value = ''; list.textContent = ''; say('Token forgotten in this tab.'); };
if (token()) load();
</script>
</body>
</html>
