# Verse's clock: a Worker with a cron trigger, because a Pages project cannot have one.
# Deploy: npx wrangler deploy --config void-cron/wrangler.toml
# Secret: npx wrangler secret put VOID_OWNER_TOKEN --config void-cron/wrangler.toml
name = "verse-cron"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
# every 5 minutes. void-tick.yml still runs every 15; the tick is idempotent per rule and window, so a second knock is a safety net.
crons = ["*/5 * * * *"]

[observability]
enabled = true
