# A failed Merge gate or Verse review used to drop a Repair job and wait for a worker. This tries the cheap
# fix first, on the PR's own helper/loop branch: tools/pr-autofix.mjs brings main in, regenerates the build
# outputs and re-runs the local gates; only if that is still red does one short scoped coder lap get the
# failed lines. Nothing is pushed unless both local gates pass; two attempts per PR are capped in fix-cap.mjs,
# then a Repair job is filed. Forks never run this with a write token. Bot pushes wake automerge by hand.
name: PR autofix
run-name: pr-autofix ${{ github.event.workflow_run.head_branch }} ${{ github.event.workflow_run.name }}

on:
  workflow_run:
    workflows: ["Merge gate", "Verse review"]
    types: [completed]

concurrency:
  group: pr-autofix-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  autofix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'helper/') ||
       startsWith(github.event.workflow_run.head_branch, 'loop/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Which pull request failed
        id: pr
        env:
          GH_TOKEN: ${{ secrets.VERSE_BOT_TOKEN || secrets.VERSE_LOOP_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          num="$EVENT_PR"
          if [ -z "$num" ]; then
            for try in 1 2 3; do
              num=$(gh api "repos/$REPO/actions/runs/$RUN_ID/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
              [ -n "$num" ] && break
              sleep $(( 5 * try ))
            done
          fi
          if [ -z "$num" ]; then
            echo "::notice::run $RUN_ID has no pull request; nothing to autofix"
            exit 0
          fi
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.VERSE_BOT_TOKEN || secrets.VERSE_LOOP_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number != ''
        with: { node-version: 22 }

      - name: The failed check's log
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.VERSE_BOT_TOKEN || secrets.VERSE_LOOP_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --repo "$REPO" --log-failed > "$RUNNER_TEMP/pr-autofix.log" 2>&1 || true

      - name: Two tiers, then a Repair job
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.VERSE_BOT_TOKEN || secrets.VERSE_LOOP_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          AUTOFIX_LOG: ${{ runner.temp }}/pr-autofix.log
          VOID_OWNER_TOKEN: ${{ secrets.VOID_OWNER_TOKEN }}
          VOID_SITE: ${{ secrets.VOID_SITE || 'https://a-to-mind.com' }}
          VOID_REVIEW_KEY: ${{ secrets.VOID_OWNER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node tools/pr-autofix.mjs
