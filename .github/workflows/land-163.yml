# This branch only. A pull request event from this app does not start Verse check.
# A push does. The merge workflow on main still ignores a push run, so this
# job squash-merges the open pull request after the check on this same commit.
name: Land 163
on:
  push:
    branches:
      - cursor/show-scenes-sc1-1-da37
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    name: Verse check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bring main in
        run: git fetch --no-tags origin main && git -c user.name=verse-check -c user.email=check@a-to-mind.com merge --no-edit origin/main
      - name: pre-PR check
        env:
          PRE_PR_BASE: origin/main
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          pr=$(gh api -H "Accept: application/vnd.github+json" "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.state=="open")][0].number // empty')
          if [ -n "$pr" ]; then node tools/pre-pr.mjs --check-only --pr "$pr"
          else node tools/pre-pr.mjs --check-only
          fi
      - name: merge gate
        env:
          MERGE_GATE_BASE: origin/main
          VISION_JUDGE_SHOTS: ${{ runner.temp }}/vision-judge-shots
        run: node tools/merge-gate.mjs
  land:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: squash-merge when the check is green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          pr=$(gh api -H "Accept: application/vnd.github+json" "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state=="open")][0]')
          n=$(echo "$pr" | jq -r '.number // empty')
          labels=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')
          [ -n "$n" ]
          case ",$labels," in *,automerge,*) ;; *) echo "not labelled automerge"; exit 0 ;; esac
          gh pr merge "$n" -R "$REPO" --squash --match-head-commit "$SHA"
