name: Verse check
# pull_request covers a pull request opened by a person. A push covers a branch update from the
# Cursor app: that push is delivered (other apps start on it) while the pull_request event for
# the same branch is not, so listening only to pull_request leaves the check unstarted.
# main is excluded: a merge to main is not a pull request check. This is not pull_request_target.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  push:
    branches-ignore:
      - main
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: verse-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    name: Verse check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bring main in
        run: git fetch --no-tags origin main && git -c user.name=verse-check -c user.email=check@a-to-mind.com merge --no-edit origin/main
      - name: pre-PR check
        env:
          PRE_PR_BASE: origin/main
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          pr="$PR_FROM_EVENT"
          if [ -z "$pr" ]; then
            pr=$(gh api -H "Accept: application/vnd.github+json" "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
          fi
          if [ -n "$pr" ]; then
            node tools/pre-pr.mjs --check-only --pr "$pr"
          else
            node tools/pre-pr.mjs --check-only
          fi
      - name: merge gate
        env:
          MERGE_GATE_BASE: origin/main
          VISION_JUDGE_SHOTS: ${{ runner.temp }}/vision-judge-shots
        run: node tools/merge-gate.mjs
